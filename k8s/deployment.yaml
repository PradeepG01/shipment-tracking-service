apiVersion: apps/v1
kind: Deployment
metadata:
  name: shipment-tracking-service
spec:
  replicas: 2
  selector:
    matchLabels: {app: shipment-tracking-service}
  template:
    metadata:
      labels: {app: shipment-tracking-service}
    spec:
      containers:
        - name: api
          image: ghcr.io/your-github-username/shipment-tracking-service:latest
          ports: [{containerPort: 8080}]
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: postgres}
          envFrom:
            - secretRef: {name: shipment-db}   # DATABASE_URL, DATABASE_USERNAME, DATABASE_PASSWORD
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            initialDelaySeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: shipment-tracking-service
spec:
  selector: {app: shipment-tracking-service}
  ports: [{port: 80, targetPort: 8080}]
