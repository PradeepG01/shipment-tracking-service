spring:
  application:
    name: shipment-tracking-service
  datasource:
    # Local default: in-memory H2 in PostgreSQL compatibility mode. Use the "postgres" profile in real environments.
    url: jdbc:h2:mem:shipments;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway migrations
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

server:
  shutdown: graceful

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/shipments}
    username: ${DATABASE_USERNAME:shipments}
    password: ${DATABASE_PASSWORD:shipments}
